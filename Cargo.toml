[workspace]
resolver = "2"
members = [
    "crates/domains",

    "crates/mimetype",
    "crates/snowflake",

    "crates/storage",
    "crates/storage-address",
    "crates/storage-sys",

    "crates/utils",
]

[workspace.package]
edition = "2024"
repository = "https://github.com/yixone/imfield"

[workspace.dependencies]
# --- Internal ---
imfield-domains.path = "crates/domains"

imfield-mimetype.path = "crates/mimetype"
imfield-snowflake.path = "crates/snowflake"

imfield-storage.path = "crates/storage"
imfield-storage-address.path = "crates/storage-address"
imfield-storage-sys.path = "crates/storage-sys"

imfield-utils.path = "crates/utils"

# --- Extern ---
base64 = "0.23.1"
chrono = "0.4.42"
hex = "0.4.3"
rand = "0.10.1"
serde = "1.0.219"
sqlx = "0.8.5"
tokio = "1.47.1"

# --- FFI ---
libc = "0.2.189"
winapi = "0.3.9"
