[workspace]
resolver = "2"
members = [
    "crates/core/database",
    "crates/core/domains",

    "crates/core/storage",
    "crates/core/storage-address",

    "crates/shared/mimetype",
    "crates/shared/snowflake",
    "crates/shared/utils",
]

[workspace.package]
edition = "2024"
repository = "https://github.com/yixone/imfield"

[workspace.dependencies]
# --- Internal ---
imfield-database.path = "crates/core/database"
imfield-domains.path = "crates/core/domains"

imfield-storage.path = "crates/core/storage"
imfield-storage-address.path = "crates/core/storage-address"

imfield-mimetype.path = "crates/shared/mimetype"
imfield-snowflake.path = "crates/shared/snowflake"

imfield-utils.path = "crates/shared/utils"

# --- Extern ---
async-trait = "0.1.89"
base64 = "0.23.1"
chrono = "0.4.42"
hex = "0.4.3"
rand = "0.10.1"
serde = "1.0.219"
sqlx = "0.8.5"
tokio = "1.47.1"

# --- FFI ---
libc = "0.2.189"
winapi = "0.3.9"
