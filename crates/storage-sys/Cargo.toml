[package]
name = "imfield-storage-sys"
version = "0.1.0"
edition.workspace = true

[dependencies]
# --- Extern ---
tokio = { workspace = true, features = ["io-util", "fs", "rt"] }

# --- FFI ---
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
winapi = { workspace = true, features = [
    "handleapi",
    "processthreadsapi",
    "winerror",
    "fileapi",
    "winbase",
    "std",
] }
