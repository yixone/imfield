[package]
name = "imfield-domains"
version = "0.1.0"
edition.workspace = true

[features]
serde = [
    "dep:serde",
    "chrono/serde",
    "imfield-snowflake/serde",
    "imfield-mimetype/serde",
]
sqlx = ["dep:sqlx", "imfield-snowflake/sqlx", "imfield-mimetype/sqlx"]

default = []

[dependencies]
# Workspace
imfield-mimetype.workspace = true
imfield-snowflake.workspace = true

# Extern
chrono.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
sqlx = { workspace = true, features = ["chrono"], optional = true }
