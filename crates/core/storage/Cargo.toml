[package]
name = "imfield-storage"
version = "0.1.0"
edition.workspace = true

[dependencies]
# --- Interanl ---
imfield-models.workspace = true
imfield-storage-address.workspace = true
imfield-utils.workspace = true

# --- Extern ---
futures = { workspace = true }
tokio = { workspace = true, features = ["io-util", "fs", "time", "rt"] }
tokio-util = { workspace = true, features = ["io"] }

# --- Tests ---
[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# --- FFI ---
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
winapi = { workspace = true, features = [
    "handleapi",
    "processthreadsapi",
    "winerror",
    "fileapi",
    "winbase",
    "std",
] }
